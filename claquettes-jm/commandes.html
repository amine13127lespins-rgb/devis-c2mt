<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes — Maison Jasna</title>
<link rel="icon" href="images/logo.webp?v=3">
<style>
:root{
  --creme:#f5efe4;
  --creme-fonce:#ece3d2;
  --or:#b3924f;
  --or-clair:#d4bc85;
  --brun:#3d3427;
  --brun-doux:#6b5d48;
  --orange:#e8650d;
  --blanc:#fffdf8;
  --rouge:#c0392b;
  --vert:#27ae60;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Georgia,'Times New Roman',serif;
  background:var(--creme);color:var(--brun);min-height:100vh;
}
/* ---------- Connexion ---------- */
.login{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--creme);padding:24px;text-align:center;
}
.login img{width:110px;border-radius:50%;margin-bottom:22px;box-shadow:0 14px 40px rgba(61,52,39,.2)}
.login h1{font-weight:normal;letter-spacing:.25em;font-size:1.3rem}
.login .sous{color:var(--or);letter-spacing:.35em;text-transform:uppercase;font-size:.65rem;margin:6px 0 30px}
.login input{
  width:min(320px,80vw);padding:15px;text-align:center;
  border:1px solid rgba(107,93,72,.4);border-radius:12px;
  font-family:inherit;font-size:1.05rem;background:var(--blanc);
}
.login input:focus{outline:none;border-color:var(--or)}
.login button{
  margin-top:14px;width:min(320px,80vw);padding:15px;
  border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--or),#c9a45e);color:#fff;
  font-family:inherit;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;
  box-shadow:0 10px 26px rgba(179,146,79,.4);
}
.login .err{color:var(--rouge);margin-top:14px;min-height:1.3em;font-size:.9rem}
/* ---------- App ---------- */
.app{display:none;max-width:1000px;margin:0 auto;padding:24px 16px 80px}
.entete{
  display:flex;align-items:center;gap:14px;
  padding:10px 0 22px;border-bottom:1px solid rgba(179,146,79,.3);margin-bottom:26px;
}
.entete img{width:54px;height:54px;border-radius:50%}
.entete h1{font-weight:normal;font-size:1.25rem;letter-spacing:.15em}
.entete .sous{color:var(--or);font-size:.65rem;letter-spacing:.3em;text-transform:uppercase}
.entete .lien-site{margin-left:auto;font-size:.85rem;color:var(--or);text-decoration:none;border:1px solid var(--or);padding:8px 14px;border-radius:8px}
/* stock */
.stocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:34px}
.stock-carte{
  background:var(--blanc);border-radius:14px;padding:16px;text-align:center;
  box-shadow:0 8px 22px rgba(61,52,39,.10);
}
.stock-carte .pastille{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;outline:1px solid rgba(107,93,72,.3);outline-offset:2px}
.stock-carte .coul{font-size:.8rem;color:var(--brun-doux);font-style:italic}
.stock-carte .nb{font-size:1.7rem;margin-top:4px}
.stock-carte .nb.peu{color:var(--orange)}
.stock-carte .nb.zero{color:var(--rouge)}
.stock-carte .rest{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--brun-doux)}
/* filtres */
.filtres{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filtre{
  padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.85rem;
  border:1px solid rgba(107,93,72,.35);background:var(--blanc);font-family:inherit;
}
.filtre.actif{background:var(--brun);color:var(--or-clair);border-color:var(--brun)}
/* commandes */
.vide{text-align:center;color:var(--brun-doux);font-style:italic;padding:50px 0}
.commande{
  background:var(--blanc);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 8px 22px rgba(61,52,39,.10);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  border-left:5px solid var(--or-clair);
}
.commande.validee{border-left-color:var(--vert)}
.commande .infos{flex:1;min-width:220px}
.commande .qui{font-size:1.1rem}
.commande .quand{font-size:.82rem;color:var(--brun-doux);margin-top:3px}
.commande .quoi{margin-top:8px;font-size:.92rem}
.commande .quoi .coul-point{
  display:inline-block;background:var(--creme-fonce);border-radius:6px;
  padding:3px 10px;margin-right:6px;margin-top:4px;
}
.commande .tel a{color:var(--brun);text-decoration:none;font-size:1rem}
.commande .tel a::before{content:"📞 "}
.etiquette{
  font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;
}
.etiquette.attente{background:#fdf3e3;color:var(--orange);border:1px solid var(--orange)}
.etiquette.validee{background:#e9f9ef;color:var(--vert);border:1px solid var(--vert)}
.commande .boutons{display:flex;gap:8px}
.commande .boutons button{
  padding:11px 18px;border:none;border-radius:9px;cursor:pointer;
  font-family:inherit;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .2s;
}
.commande .boutons button:hover{transform:translateY(-2px)}
.btn-valider{background:var(--vert);color:#fff;box-shadow:0 6px 16px rgba(39,174,96,.35)}
.btn-supprimer{background:transparent;color:var(--rouge);border:1px solid var(--rouge) !important}
@media(max-width:560px){
  .commande{flex-direction:column;align-items:flex-start}
  .commande .boutons{width:100%}
  .commande .boutons button{flex:1}
}
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div class="login" id="login">
  <img src="images/logo.webp?v=3" alt="Maison Jasna">
  <h1>MAISON JASNA</h1>
  <div class="sous">Tableau des commandes</div>
  <input type="password" id="pwd" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')connexion()">
  <button onclick="connexion()">Entrer</button>
  <div class="err" id="login-err"></div>
</div>

<!-- APPLICATION -->
<div class="app" id="app">
  <div class="entete">
    <img src="images/logo.webp?v=3" alt="Maison Jasna">
    <div>
      <h1>Commandes</h1>
      <div class="sous">Claquettes Oran — 100 €</div>
    </div>
    <a class="lien-site" href="index.html">Voir le site</a>
  </div>

  <div class="stocks" id="stocks"></div>

  <div class="filtres">
    <button class="filtre actif" data-filtre="tous">Toutes</button>
    <button class="filtre" data-filtre="attente">En attente</button>
    <button class="filtre" data-filtre="validee">Validées</button>
  </div>

  <div id="liste"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ===== MOT DE PASSE =====
const MOT_DE_PASSE = 'jm2026';

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDh0f3x8Vj2u8S7-NBjVmV7KNE2RY5bLA8",
  authDomain: "bene-diners.firebaseapp.com",
  databaseURL: "https://bene-diners-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bene-diners",
  storageBucket: "bene-diners.firebasestorage.app",
  messagingSenderId: "655264478961",
  appId: "1:655264478961:web:848148ab9f1d52951d1b50"
};
let REF_COMMANDES = null;
try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  REF_COMMANDES = firebase.database().ref('claquettesJM/commandes');
} catch(e) {
  console.error('Firebase indisponible :', e);
}

const STOCK_INITIAL = {
  "Bleu Glacier": 6,
  "Corail": 20,
  "Bordeaux": 20,
  "Jaune Citron": 20
};
const COULEURS_HEX = {
  "Bleu Glacier": "#cfe4e6",
  "Corail": "#e8776a",
  "Bordeaux": "#77444d",
  "Jaune Citron": "#e9e27f"
};

let commandes = {};
let filtreActif = 'tous';

function connexion(){
  if (document.getElementById('pwd').value === MOT_DE_PASSE){
    sessionStorage.setItem('jm_ok','1');
    demarrer();
  } else {
    document.getElementById('login-err').textContent = 'Mot de passe incorrect';
  }
}
if (sessionStorage.getItem('jm_ok') === '1') demarrer();

function demarrer(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (!REF_COMMANDES){
    afficher();
    document.getElementById('liste').innerHTML = '<div class="vide">Connexion impossible — vérifiez votre réseau et rechargez la page.</div>';
    return;
  }
  REF_COMMANDES.on('value', snap => {
    commandes = snap.val() || {};
    afficher();
  });
}

function stockRestant(){
  const s = {...STOCK_INITIAL};
  Object.values(commandes).forEach(c => {
    if (c.statut === 'validee' && s[c.couleur] !== undefined){
      s[c.couleur] = Math.max(0, s[c.couleur] - 1);
    }
  });
  return s;
}

function formatDate(ts){
  const d = new Date(ts);
  const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()] + ' à ' + h + 'h' + m;
}

function echapper(t){
  const div = document.createElement('div');
  div.textContent = t == null ? '' : String(t);
  return div.innerHTML;
}

function afficher(){
  // stocks
  const s = stockRestant();
  document.getElementById('stocks').innerHTML = Object.keys(STOCK_INITIAL).map(c => {
    const n = s[c];
    const cls = n === 0 ? 'zero' : (n <= 6 ? 'peu' : '');
    return '<div class="stock-carte">' +
      '<div class="pastille" style="background:' + COULEURS_HEX[c] + '"></div>' +
      '<div class="coul">' + c + '</div>' +
      '<div class="nb ' + cls + '">' + n + '</div>' +
      '<div class="rest">restante' + (n>1?'s':'') + '</div>' +
    '</div>';
  }).join('');

  // liste des commandes (plus récentes en premier)
  const entrees = Object.entries(commandes)
    .sort((a,b) => (b[1].date||0) - (a[1].date||0))
    .filter(([id,c]) => filtreActif === 'tous' || (c.statut||'attente') === filtreActif);

  const liste = document.getElementById('liste');
  if (!entrees.length){
    liste.innerHTML = '<div class="vide">Aucune commande pour le moment.</div>';
    return;
  }
  liste.innerHTML = entrees.map(([id,c]) => {
    const statut = c.statut || 'attente';
    const telBrut = String(c.tel||'').replace(/[^0-9+]/g,'');
    return '<div class="commande ' + statut + '">' +
      '<div class="infos">' +
        '<div class="qui">' + echapper(c.prenom) + ' <strong>' + echapper((c.nom||'').toUpperCase()) + '</strong></div>' +
        '<div class="quand">🕐 ' + formatDate(c.date||0) + '</div>' +
        '<div class="quoi">' + echapper(c.produit||'Claquettes Oran') +
          '<span class="coul-point">' + echapper(c.couleur) + '</span>' +
          '<span class="coul-point">Pointure ' + echapper(c.pointure) + '</span>' +
          '<span class="coul-point">' + echapper(c.prix||100) + ' €</span>' +
        '</div>' +
        '<div class="tel" style="margin-top:8px"><a href="tel:' + telBrut + '">' + echapper(c.tel) + '</a></div>' +
      '</div>' +
      '<span class="etiquette ' + statut + '">' + (statut === 'validee' ? 'Validée ✓' : 'En attente') + '</span>' +
      '<div class="boutons">' +
        (statut === 'attente'
          ? '<button class="btn-valider" onclick="valider(\'' + id + '\')">Valider</button>'
          : '') +
        '<button class="btn-supprimer" onclick="supprimer(\'' + id + '\')">Supprimer</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function valider(id){
  const c = commandes[id];
  if (!c) return;
  const s = stockRestant();
  if (s[c.couleur] === 0){
    alert("Attention : le stock " + c.couleur + " est déjà à 0. Validation impossible.");
    return;
  }
  REF_COMMANDES.child(id).update({ statut: 'validee' });
}

function supprimer(id){
  const c = commandes[id];
  if (!c) return;
  const ok = confirm("Supprimer la commande de " + (c.prenom||'') + " " + (c.nom||'') + " ?" +
    (c.statut === 'validee' ? "\n(La paire retournera dans le stock)" : ""));
  if (ok) REF_COMMANDES.child(id).remove();
}

document.querySelectorAll('.filtre').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('.filtre').forEach(x => x.classList.remove('actif'));
    f.classList.add('actif');
    filtreActif = f.dataset.filtre;
    afficher();
  });
});
</script>
</body>
</html>
