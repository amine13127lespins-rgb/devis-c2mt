<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Béné diner's — Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#ff1a1a;--red-glow:rgba(255,26,26,0.5);
  --yellow:#ffd700;--bg:#07000a;
}
body{
  font-family:'Open Sans',sans-serif;
  background:var(--bg);color:#f0e6d3;
  min-height:100vh;overflow-x:hidden;
}
body::before{content:'';position:fixed;inset:0;background:url('bg-night.webp')center/cover no-repeat;z-index:0;opacity:0.2}

/* HEADER */
.header{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,0.9);border-bottom:2px solid var(--red);
  padding:0 20px;height:64px;
  box-shadow:0 0 20px var(--red-glow);
}
.header img{height:44px;filter:drop-shadow(0 0 8px rgba(255,100,0,0.7))}
.header-title{font-family:'Bebas Neue',cursive;font-size:1.5rem;color:var(--yellow);text-shadow:0 0 10px rgba(255,215,0,0.4);letter-spacing:1px}
.back-btn{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;padding:7px 14px;color:#9a8a7a;
  font-family:'Oswald',sans-serif;font-size:0.85rem;cursor:pointer;
  text-decoration:none;transition:all 0.2s;
}
.back-btn:hover{color:#f0e6d3;border-color:rgba(255,26,26,0.4)}

/* STATS BAR */
.stats{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:14px 20px;
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.stat-box{
  text-align:center;
  background:rgba(255,26,26,0.1);border:1px solid rgba(255,26,26,0.25);
  border-radius:12px;padding:8px 20px;
}
.stat-val{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--yellow);text-shadow:0 0 8px rgba(255,215,0,0.4);line-height:1}
.stat-lbl{font-size:0.68rem;color:#9a8a7a;letter-spacing:1px;text-transform:uppercase}
.btn-restart{
  background:var(--red);border:none;border-radius:12px;
  padding:10px 22px;color:#fff;
  font-family:'Oswald',sans-serif;font-size:0.9rem;font-weight:600;
  cursor:pointer;box-shadow:0 0 12px var(--red-glow);
  transition:all 0.2s;
}
.btn-restart:hover{background:#ff3333;transform:translateY(-1px)}

/* GAME GRID */
.game-wrap{position:relative;z-index:2;padding:20px;display:flex;justify-content:center}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  width:100%;max-width:760px;
}
@media(min-width:600px){.grid{grid-template-columns:repeat(7,1fr)}}

/* CARD */
.card{
  aspect-ratio:3/4;
  perspective:600px;
  cursor:pointer;
}
.card-inner{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  border-radius:12px;
}
.card.flipped .card-inner,.card.matched .card-inner{
  transform:rotateY(180deg);
}
.card-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:12px;
  overflow:hidden;
}
/* BACK */
.card-back{
  background:linear-gradient(135deg,#1a0005,#2d0010);
  border:2px solid rgba(255,26,26,0.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(255,26,26,0.1);
}
.card-back img{width:60%;opacity:0.7;filter:drop-shadow(0 0 6px rgba(255,100,0,0.5))}
/* FRONT */
.card-front{
  transform:rotateY(180deg);
  border:2px solid rgba(255,215,0,0.3);
}
.card-front img{width:100%;height:100%;object-fit:cover}
.card-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.85));
  padding:6px 4px 4px;
  font-family:'Oswald',sans-serif;font-size:clamp(0.5rem,1.2vw,0.72rem);
  font-weight:600;text-align:center;color:#ffd700;line-height:1.2;
}
/* MATCHED */
.card.matched .card-inner{
  box-shadow:0 0 18px rgba(37,211,102,0.6);
}
.card.matched .card-front{
  border-color:rgba(37,211,102,0.7);
}
/* WRONG SHAKE */
.card.wrong .card-inner{
  animation:shake 0.4s ease;
}
@keyframes shake{
  0%,100%{transform:rotateY(180deg)}
  25%{transform:rotateY(180deg) translateX(-6px)}
  75%{transform:rotateY(180deg) translateX(6px)}
}

/* WIN OVERLAY */
.win-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.92);
  display:none;align-items:center;justify-content:center;
}
.win-box{
  text-align:center;
  animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
.win-emoji{font-size:4rem;display:block;margin-bottom:16px}
.win-title{font-family:'Bebas Neue',cursive;font-size:3.5rem;color:var(--yellow);text-shadow:0 0 20px rgba(255,215,0,0.6);margin-bottom:8px}
.win-sub{font-size:1rem;color:#c0a880;margin-bottom:8px}
.win-score{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--red);text-shadow:0 0 12px var(--red-glow);margin-bottom:28px}
.win-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.win-btn{
  border:none;border-radius:50px;padding:13px 28px;
  font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;text-decoration:none;
}
.win-btn-red{background:var(--red);color:#fff;box-shadow:0 0 14px var(--red-glow)}
.win-btn-red:hover{background:#ff3333;transform:translateY(-2px)}
.win-btn-outline{background:transparent;color:#f0e6d3;border:1.5px solid rgba(255,255,255,0.2)}
.win-btn-outline:hover{background:rgba(255,255,255,0.08)}

/* CONFETTI */
.confetti-piece{position:fixed;z-index:1001;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<header class="header">
  <img src="logo-bene.webp" alt="Logo">
  <span class="header-title">🎴 Memory du menu</span>
  <a href="index.html" class="back-btn">← Retour</a>
</header>

<div class="stats">
  <div class="stat-box">
    <div class="stat-val" id="moves">0</div>
    <div class="stat-lbl">Coups</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="pairs">0/7</div>
    <div class="stat-lbl">Paires</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="timer">0:00</div>
    <div class="stat-lbl">Temps</div>
  </div>
  <button class="btn-restart" onclick="startGame()">🔄 Rejouer</button>
</div>

<div class="game-wrap">
  <div class="grid" id="grid"></div>
</div>

<!-- WIN SCREEN -->
<div class="win-overlay" id="win-overlay">
  <div class="win-box">
    <span class="win-emoji">🏆</span>
    <div class="win-title">Bravo !</div>
    <div class="win-sub">Tu as trouvé toutes les paires</div>
    <div class="win-score" id="win-score"></div>
    <div class="win-btns">
      <button class="win-btn win-btn-red" onclick="startGame()">🔄 Rejouer</button>
      <a href="menu.html" class="win-btn win-btn-outline">🍔 Commander</a>
    </div>
  </div>
</div>

<script>
const CARDS = [
  { id:1, img:'menu-bigmac.jpg',      name:'Big Mac' },
  { id:2, img:'menu-cheeseburger.jpg',name:'Double Cheese' },
  { id:3, img:'menu-golden.jpg',      name:'Golden Big Mac' },
  { id:4, img:'menu-filetfish.jpg',   name:'Double Filet Fish' },
  { id:5, img:'menu-wings.jpg',       name:'Wings x10' },
  { id:6, img:'menu-longfish.jpg',    name:'Long Fish' },
  { id:7, img:'menu-classiq.jpg',     name:'ClassiQ Crispy' },
];

let flipped = [], matched = 0, moves = 0, lock = false;
let timerInterval = null, seconds = 0, started = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  clearInterval(timerInterval);
  flipped = []; matched = 0; moves = 0; lock = false; seconds = 0; started = false;
  document.getElementById('moves').textContent = '0';
  document.getElementById('pairs').textContent = '0/7';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('win-overlay').style.display = 'none';

  const deck = shuffle([...CARDS, ...CARDS]);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  deck.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <img src="logo-bene.webp" alt="?">
        </div>
        <div class="card-face card-front">
          <img src="${card.img}" alt="${card.name}">
          <div class="card-label">${card.name}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => flipCard(el));
    grid.appendChild(el);
  });
}

function startTimer() {
  if (started) return;
  started = true;
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function flipCard(el) {
  if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  startTimer();
  playBlip();
  el.classList.add('flipped');
  flipped.push(el);
  if (flipped.length === 2) checkMatch();
}

function checkMatch() {
  lock = true;
  moves++;
  document.getElementById('moves').textContent = moves;
  const [a, b] = flipped;
  if (a.dataset.id === b.dataset.id) {
    // Match !
    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      playDing();
      matched++;
      document.getElementById('pairs').textContent = `${matched}/7`;
      flipped = [];
      lock = false;
      if (matched === 7) win();
    }, 300);
  } else {
    // No match
    setTimeout(() => {
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(() => {
        a.classList.remove('flipped','wrong');
        b.classList.remove('flipped','wrong');
        flipped = [];
        lock = false;
      }, 400);
    }, 700);
  }
}

function win() {
  clearInterval(timerInterval);
  playFanfare();
  launchConfetti();
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  document.getElementById('win-score').textContent = `${moves} coups · ${m}:${s.toString().padStart(2,'0')}`;
  setTimeout(() => {
    document.getElementById('win-overlay').style.display = 'flex';
  }, 600);
}

// SOUNDS
function getCtx() {
  if (!window._ac) window._ac = new (window.AudioContext || window.webkitAudioContext)();
  window._ac.resume();
  return window._ac;
}
function playBlip() {
  try {
    const ctx = getCtx(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'square'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.12);
  } catch(e){}
}
function playDing() {
  try {
    const ctx = getCtx();
    [[880,0],[1100,0.12],[1320,0.24]].forEach(([f,t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.18, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.5);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.55);
    });
  } catch(e){}
}
function playFanfare() {
  try {
    const ctx = getCtx();
    [[523,0],[659,0.13],[784,0.26],[1047,0.39],[784,0.52],[1047,0.6]].forEach(([f,t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'square';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.1, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.38);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.4);
    });
  } catch(e){}
}
function launchConfetti() {
  const colors = ['#ff1a1a','#ffd700','#ff6a00','#ffffff','#ff69b4','#00ffff'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}vw;top:${-(Math.random()*10+5)}vh;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${Math.random()*1.5+1}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}

document.addEventListener('click', () => { try { getCtx(); } catch(e){} });
startGame();
</script>
</body>
</html>
