<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Béné diner's — Commandes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#ff1a1a;--red-glow:rgba(255,26,26,0.5);
  --yellow:#ffd700;--orange:#ff6a00;
  --bg:#07000a;--card:rgba(15,5,20,0.95);
}
body{font-family:'Open Sans',sans-serif;background:var(--bg);color:#f0e6d3;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:url('bg-night.webp') center/cover no-repeat;z-index:0}
body::after{content:'';position:fixed;inset:0;background:rgba(7,0,10,0.85);z-index:1}

/* LOGIN */
.login-screen{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);
}
.login-box{
  background:var(--card);border:1px solid rgba(255,26,26,0.3);
  border-radius:20px;padding:40px 32px;width:90%;max-width:360px;
  text-align:center;box-shadow:0 0 40px rgba(255,26,26,0.15);
}
.login-logo{height:70px;margin-bottom:20px;filter:drop-shadow(0 0 10px rgba(255,100,0,0.6))}
.login-box h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--yellow);
  text-shadow:0 0 10px rgba(255,215,0,0.4);margin-bottom:6px}
.login-box p{font-size:0.8rem;color:#9a8a7a;margin-bottom:24px}
.login-box input{
  width:100%;background:rgba(255,255,255,0.06);
  border:1.5px solid rgba(255,26,26,0.3);border-radius:10px;
  padding:12px 16px;color:#f0e6d3;font-size:1rem;outline:none;
  margin-bottom:14px;font-family:'Open Sans',sans-serif;
  -webkit-text-security:disc;
}
.login-box input:focus{border-color:var(--red);box-shadow:0 0 10px var(--red-glow)}
.login-btn{
  width:100%;background:var(--red);border:none;border-radius:10px;
  padding:13px;color:#fff;font-family:'Oswald',sans-serif;font-size:1rem;
  font-weight:600;cursor:pointer;box-shadow:0 0 14px var(--red-glow);
  transition:all 0.2s;
}
.login-btn:hover{background:#ff3333;transform:translateY(-1px)}
.login-error{color:var(--red);font-size:0.8rem;margin-top:10px;display:none}

/* DASHBOARD */
.dashboard{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:20px 16px 80px}

.dash-header{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,0,0,0.95);border-bottom:2px solid var(--red);
  position:fixed;top:0;left:0;right:0;height:64px;z-index:100;
  padding:0 20px;box-shadow:0 0 20px var(--red-glow);backdrop-filter:blur(10px);
}
.dash-logo{height:44px;filter:drop-shadow(0 0 8px rgba(255,100,0,0.6))}
.dash-title{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--yellow);
  text-shadow:0 0 8px rgba(255,215,0,0.4);letter-spacing:1px}
.dash-stats{display:flex;gap:16px;align-items:center}
.stat-badge{
  background:rgba(255,26,26,0.15);border:1px solid rgba(255,26,26,0.3);
  border-radius:20px;padding:4px 14px;font-family:'Oswald',sans-serif;font-size:0.85rem;
}
.stat-badge span{color:var(--yellow);font-weight:700}
.logout-btn{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;padding:6px 12px;color:#9a8a7a;font-size:0.75rem;cursor:pointer;
  transition:all 0.2s;
}
.logout-btn:hover{color:#f0e6d3;border-color:rgba(255,26,26,0.3)}

.dash-content{padding-top:84px}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{
  background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,26,26,0.2);
  border-radius:20px;padding:7px 16px;color:#9a8a7a;
  font-family:'Oswald',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s;
}
.filter-btn:hover{border-color:var(--red);color:#f0e6d3}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#fff;
  box-shadow:0 0 10px var(--red-glow)}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;color:#9a8a7a;
}
.empty-state .icon{font-size:3.5rem;display:block;margin-bottom:16px}
.empty-state p{font-size:1rem;margin-bottom:6px}
.empty-state small{font-size:0.78rem;opacity:0.6}

/* ORDER CARD */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.order-card{
  background:var(--card);border:1px solid rgba(255,26,26,0.2);
  border-radius:16px;overflow:hidden;
  transition:transform 0.2s,box-shadow 0.2s;
  animation:slideIn 0.3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.order-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,26,26,0.2)}

.order-card.status-new{border-color:rgba(255,26,26,0.4)}
.order-card.status-progress{border-color:rgba(255,165,0,0.5)}
.order-card.status-done{border-color:rgba(37,211,102,0.4);opacity:0.7}

.order-head{
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.order-num{font-family:'Bebas Neue',cursive;font-size:1.2rem;color:var(--yellow);
  text-shadow:0 0 6px rgba(255,215,0,0.3)}
.order-time{font-size:0.72rem;color:#9a8a7a}

.status-badge{
  font-family:'Oswald',sans-serif;font-size:0.7rem;font-weight:600;
  padding:3px 10px;border-radius:12px;letter-spacing:0.5px;text-transform:uppercase;
}
.status-badge.new{background:rgba(255,26,26,0.2);color:var(--red);border:1px solid var(--red)}
.status-badge.progress{background:rgba(255,165,0,0.2);color:#ffa500;border:1px solid #ffa500}
.status-badge.done{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid #25d366}

.order-client{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.05)}
.order-client .name{font-family:'Oswald',sans-serif;font-size:0.95rem;font-weight:600}
.order-client .phone{font-size:0.75rem;color:#9a8a7a;margin-top:2px}

.order-items{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.05)}
.order-item{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);
}
.order-item:last-child{border:none}
.item-info{flex:1}
.item-name{font-family:'Oswald',sans-serif;font-size:0.85rem;font-weight:600}
.item-details{font-size:0.7rem;color:#9a8a7a;margin-top:2px;line-height:1.4}
.item-price{font-family:'Bebas Neue',cursive;font-size:0.95rem;color:var(--yellow);
  white-space:nowrap;padding-left:10px}

.order-total{
  padding:10px 16px;display:flex;justify-content:space-between;
  font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.order-total span:last-child{color:var(--yellow);text-shadow:0 0 6px rgba(255,215,0,0.3)}

.order-actions{padding:10px 16px;display:flex;gap:8px}
.action-btn{
  flex:1;border:none;border-radius:8px;padding:9px;
  font-family:'Oswald',sans-serif;font-size:0.8rem;font-weight:600;
  letter-spacing:0.5px;cursor:pointer;transition:all 0.2s;
}
.btn-progress{background:rgba(255,165,0,0.15);color:#ffa500;border:1px solid rgba(255,165,0,0.3)}
.btn-progress:hover{background:#ffa500;color:#000}
.btn-done{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3)}
.btn-done:hover{background:#25d366;color:#fff}
.btn-delete{background:rgba(255,26,26,0.1);color:var(--red);border:1px solid rgba(255,26,26,0.2);flex:0;padding:9px 12px}
.btn-delete:hover{background:var(--red);color:#fff}

/* NOTIF */
.notif{
  position:fixed;top:80px;right:16px;z-index:500;
  background:#1a0800;border:1px solid var(--red);border-radius:12px;
  padding:12px 18px;max-width:300px;
  box-shadow:0 0 20px var(--red-glow);
  animation:notifIn 0.3s ease;
  display:none;
}
@keyframes notifIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.notif-title{font-family:'Oswald',sans-serif;font-size:0.9rem;font-weight:600;color:var(--red);margin-bottom:4px}
.notif-body{font-size:0.78rem;color:#f0e6d3}

@media(max-width:600px){
  .dash-stats{display:none}
  .orders-grid{grid-template-columns:1fr}
  .dash-title{font-size:1.1rem}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <img src="logo-bene.webp" alt="The Béné diner's" class="login-logo">
    <h2>Espace Admin</h2>
    <p>Accès réservé au gérant</p>
    <input type="password" id="pwd-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="login-btn" onclick="checkLogin()">🔓 Connexion</button>
    <div class="login-error" id="login-error">Mot de passe incorrect</div>
  </div>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif">
  <div class="notif-title">🛎️ Nouvelle commande !</div>
  <div class="notif-body" id="notif-body"></div>
</div>

<!-- DASHBOARD -->
<header class="dash-header">
  <img src="logo-bene.webp" alt="Logo" class="dash-logo">
  <span class="dash-title">Tableau des commandes</span>
  <div class="dash-stats">
    <div class="stat-badge">Nouvelles : <span id="count-new">0</span></div>
    <div class="stat-badge">Total : <span id="count-total">0</span></div>
    <button class="logout-btn" onclick="logout()">Déconnexion</button>
  </div>
</header>

<div class="dashboard">
  <div class="dash-content">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Toutes</button>
      <button class="filter-btn" onclick="setFilter('new',this)">🔴 Nouvelles</button>
      <button class="filter-btn" onclick="setFilter('progress',this)">🟠 En cours</button>
      <button class="filter-btn" onclick="setFilter('done',this)">✅ Terminées</button>
    </div>
    <div class="orders-grid" id="orders-grid">
      <div class="empty-state" id="empty-state">
        <span class="icon">📋</span>
        <p>Aucune commande pour l'instant</p>
        <small>Les commandes apparaîtront ici en temps réel</small>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ===== MOT DE PASSE ADMIN =====
const ADMIN_PASSWORD = 'bene2024';

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyDh0f3x8Vj2u8S7-NBjVmV7KNE2RY5bLA8",
  authDomain: "bene-diners.firebaseapp.com",
  databaseURL: "https://bene-diners-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bene-diners",
  storageBucket: "bene-diners.firebasestorage.app",
  messagingSenderId: "655264478961",
  appId: "1:655264478961:web:848148ab9f1d52951d1b50"
};

// ===== AUTH =====
let isLoggedIn = false;
let currentFilter = 'all';
let allOrders = {};
let db = null;

function checkLogin() {
  const pwd = document.getElementById('pwd-input').value;
  if (pwd === ADMIN_PASSWORD) {
    isLoggedIn = true;
    document.getElementById('login-screen').style.display = 'none';
    initFirebase();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
}
function logout() {
  isLoggedIn = false;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}

// ===== FIREBASE =====
function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    listenOrders();
  } catch(e) {
    if (e.code !== 'app/duplicate-app') console.error(e);
    db = firebase.database();
    listenOrders();
  }
}

function listenOrders() {
  const ref = db.ref('orders');
  ref.on('child_added', snap => {
    const order = { id: snap.key, ...snap.val() };
    const isNew = !allOrders[order.id];
    allOrders[order.id] = order;
    if (isNew && Object.keys(allOrders).length > 1) showNotif(order);
    renderOrders();
  });
  ref.on('child_changed', snap => {
    allOrders[snap.key] = { id: snap.key, ...snap.val() };
    renderOrders();
  });
  ref.on('child_removed', snap => {
    delete allOrders[snap.key];
    renderOrders();
  });
}

function setStatus(id, status) {
  if (!db) return;
  db.ref('orders/' + id).update({ status });
}
function deleteOrder(id) {
  if (!db) return;
  if (confirm('Supprimer cette commande ?')) db.ref('orders/' + id).remove();
}

// ===== RENDER =====
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const grid = document.getElementById('orders-grid');
  const orders = Object.values(allOrders).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);

  const newCount = orders.filter(o => o.status === 'new').length;
  document.getElementById('count-new').textContent = newCount;
  document.getElementById('count-total').textContent = orders.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" id="empty-state">
      <span class="icon">📋</span>
      <p>Aucune commande ${currentFilter !== 'all' ? 'dans cette catégorie' : 'pour l\'instant'}</p>
      <small>Les commandes apparaîtront ici en temps réel</small>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(order => {
    const d = new Date(order.timestamp);
    const time = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const date = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
    const statusLabel = {new:'Nouvelle', progress:'En cours', done:'Terminée'}[order.status] || 'Nouvelle';
    const items = order.items || [];
    return `
      <div class="order-card status-${order.status || 'new'}">
        <div class="order-head">
          <div>
            <div class="order-num">#${order.orderNumber || '—'}</div>
            <div class="order-time">${date} à ${time}</div>
          </div>
          <span class="status-badge ${order.status || 'new'}">${statusLabel}</span>
        </div>
        <div class="order-client">
          <div class="name">👤 ${order.clientName}</div>
          <div class="phone">📞 ${order.clientPhone}</div>
          <div class="phone" style="margin-top:4px">
            ${order.orderType === 'dine'
              ? `🍽️ <strong style="color:#ffd700">Sur place — Table ${order.tableNumber}</strong>`
              : `🚶 À emporter`}
          </div>
        </div>
        <div class="order-items">
          ${items.map(item => `
            <div class="order-item">
              <div class="item-info">
                <div class="item-name">${item.qty}x ${item.name}</div>
                <div class="item-details">🥤 ${item.drink} · 🥫 ${item.sauce}</div>
              </div>
              <div class="item-price">${item.subtotal}</div>
            </div>`).join('')}
        </div>
        <div class="order-total">
          <span>Total</span>
          <span>${order.total}</span>
        </div>
        <div class="order-actions">
          ${order.status !== 'progress' && order.status !== 'done' ? `<button class="action-btn btn-progress" onclick="setStatus('${order.id}','progress')">🟠 En cours</button>` : ''}
          ${order.status !== 'done' ? `<button class="action-btn btn-done" onclick="setStatus('${order.id}','done')">✅ Terminée</button>` : ''}
          <button class="action-btn btn-delete" onclick="deleteOrder('${order.id}')">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function showNotif(order) {
  const n = document.getElementById('notif');
  document.getElementById('notif-body').textContent = `${order.clientName} — ${order.total}`;
  n.style.display = 'block';
  setTimeout(() => { n.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
